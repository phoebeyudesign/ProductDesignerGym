<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Take away · Product Designer Gym Cafe</title>
  <meta name="description" content="Take your café favourites to go, or order straight to your table. Choose how you want to enjoy your break.">
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../design-system/components/bundle.css">
  <link rel="stylesheet" href="home.css">
  <script src="home.js" defer></script>
</head>
<body class="body" data-mode="takeaway">
  <a class="home-skip caption" href="#ordering">Skip to ordering</a>
  <header class="home-header">
    <div class="home-bar">
      <a class="home-brand h4" href="./">Product Designer Gym <span>Cafe</span></a>
      <div class="mode-switch" role="tablist" aria-label="How would you like to order?">
        <button id="takeaway-tab" class="mode-tab caption" role="tab" aria-selected="true" aria-controls="takeaway-panel" data-mode="takeaway">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8ZM8 9V6a4 4 0 0 1 8 0v3"/></svg><span>Take away</span>
        </button>
        <button id="table-tab" class="mode-tab caption" role="tab" aria-selected="false" aria-controls="table-panel" tabindex="-1" data-mode="table">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18M6 10v11m12-11v11M7 7V3m10 4V3M3 17h3m12 0h3"/></svg><span>Order to table</span>
        </button>
      </div>
      <span id="mode-hint" class="mode-hint small" aria-live="polite">Made for your next stop.</span>
    </div>
  </header>
  <main id="ordering" tabindex="-1">
    <section id="takeaway-panel" class="order-panel" role="tabpanel" aria-labelledby="takeaway-tab">
      <iframe id="takeaway-view" src="pickup/?home=1" title="Take away ordering — customise your order and choose a pickup time"></iframe>
    </section>
    <section id="table-panel" class="order-panel" role="tabpanel" aria-labelledby="table-tab" hidden>
      <iframe id="table-view" title="Order to table — choose your spot and order from your seat"></iframe>
    </section>
  </main>
  <noscript><p>Choose <a href="pickup/">take away</a> or <a href="order/">order to table</a>. JavaScript is required for interactive ordering.</p></noscript>
</body>
</html>
